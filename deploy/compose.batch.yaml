# CyberGym 跑批编排器（compose）
#
# 全部文件都在 deploy/ 目录，从这里执行：
#   cd deploy
#   cp .env.example .env        # 填 CYBERGYM_API_KEY / AGENT_ID / 各路径
#
#   # 先干跑（只准备任务包，不启动智能体）
#   docker compose -f compose.batch.yaml run --rm batch-dry
#
#   # 正式跑（后台）
#   docker compose -f compose.batch.yaml up -d
#   docker compose -f compose.batch.yaml logs -f
#
#   # 停：先停编排器，再清它拉起的 dind（智能体跑在 dind 内部，随之一起消失）
#   docker compose -f compose.batch.yaml down
#   docker ps --filter name=trilane-dind -q | xargs -r docker rm -f
#   docker volume ls -q --filter name=trilane-dind | xargs -r docker volume rm -f
#
# 设计要点
# --------
# * network_mode: host —— 容器内 127.0.0.1 就是宿主，能直接连提交服务端；
#   compose 默认 bridge 网络下容器看不到宿主 127.0.0.1。用 host 模式后
#   --server 保持 http://127.0.0.1:8666 即可，不需要 host.docker.internal。
# * docker.sock —— 编排器要调宿主 daemon 拉起智能体容器和每任务独立的 dind。
# * **所有卷都用同路径挂载**（/X:/X）。智能体在 dind 里发出的 `docker run -v <work>/task`
#   由 dind daemon 解析，所以 task/out 也要同路径挂进 dind 容器。
#   WORK_ROOT 也必须同路径挂，不能用「宿主目录 → 固定容器路径」的映射。

x-batch-common: &batch-common
  image: ${RUNNER_IMAGE:-trilane-batch-runner:latest}
  network_mode: host
  restart: "no"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    # 以下全部同路径挂载（宿主 == 容器）
    - ${DATA_DIR:-/opt/cybergym_data}:${DATA_DIR:-/opt/cybergym_data}:ro
    - ${MASK_MAP:-/opt/mask_map.json}:${MASK_MAP:-/opt/mask_map.json}:ro
    # 任务列表从 deploy/tasks 挂进容器。源用宿主相对路径（相对 deploy/），目标固定。
    # 目标**不能**是 /opt/trilane-batch：那会把镜像里的脚本整个盖掉。
    - ${TASKS_DIR:-./tasks}:/tasklist:ro
    - ${WORK_ROOT:-/var/lib/trilane}:${WORK_ROOT:-/var/lib/trilane}
    - ${TRILANE_HOME:-/root/.trilane}:/root/.trilane:ro
  environment:
    TZ: ${TZ:-Asia/Shanghai}
    CYBERGYM_DATA_DIR: ${DATA_DIR:-/opt/cybergym_data}
    CYBERGYM_SERVER: ${CYBERGYM_SERVER:-http://127.0.0.1:8666}
    CYBERGYM_API_KEY: ${CYBERGYM_API_KEY:?CYBERGYM_API_KEY is required in .env}
    # 与服务端的 CYBERGYM_SALT / --salt 必须一致
    CYBERGYM_SALT: ${CYBERGYM_SALT:-CyberGym}

x-batch-args: &batch-args
  - --task-file
  - ${TASKS_FILE:-/tasklist/tasks.txt}
  - --data-dir
  - ${DATA_DIR:-/opt/cybergym_data}
  - --mask-map
  - ${MASK_MAP:-/opt/mask_map.json}
  # 必须与服务端一致：checksum = sha256(masked_id + agent_id + salt)
  - --salt
  - ${CYBERGYM_SALT:-CyberGym}
  - --server
  - ${CYBERGYM_SERVER:-http://127.0.0.1:8666}
  - --agent-id
  - ${AGENT_ID:-trilane-batch}
  - --isolation
  - ${ISOLATION:-dind}
  - --dind-image
  - ${DIND_IMAGE:-docker:dind}
  - --agent-image
  - ${AGENT_IMAGE:-trilane-headless:1.0.1}
  - --concurrency
  - "${CONCURRENCY:-1}"
  - --timeout-sec
  - "${TASK_TIMEOUT_SEC:-14400}"
  - --agent-retries
  - "${AGENT_RETRIES:-1}"
  - --max-submits
  - "${MAX_SUBMITS:-3}"
  - --verify-rounds
  - "${VERIFY_ROUNDS:-3}"
  - --work-root
  - ${WORK_ROOT:-/var/lib/trilane}/runs/${BATCH_NAME:-batch-1}

services:
  # 正式跑。容器退出码 0 = 本批有 solved，1 = 没有，3 = preflight 未通过
  batch:
    <<: *batch-common
    container_name: ${CONTAINER_NAME:-trilane-batch}
    command: *batch-args

  # 干跑：只做 preflight + 任务包准备，不启动智能体
  batch-dry:
    <<: *batch-common
    container_name: ${CONTAINER_NAME:-trilane-batch}-dry
    command:
      - --task-file
      - ${TASKS_FILE:-/tasklist/tasks.txt}
      - --data-dir
      - ${DATA_DIR:-/opt/cybergym_data}
      - --mask-map
      - ${MASK_MAP:-/opt/mask_map.json}
      - --salt
      - ${CYBERGYM_SALT:-CyberGym}
      - --server
      - ${CYBERGYM_SERVER:-http://127.0.0.1:8666}
      - --work-root
      - ${WORK_ROOT:-/var/lib/trilane}/runs/${BATCH_NAME:-batch-1}
      - --isolation
      - ${ISOLATION:-dind}
      - --dind-image
      - ${DIND_IMAGE:-docker:dind}
      - --agent-image
      - ${AGENT_IMAGE:-trilane-headless:1.0.1}
      - --dry-run
